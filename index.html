<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- title, description, Open Graph and structured data are written by scripts/seo-plugin.ts from src/data -->
    <!--seo:head-->
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!-- Before the first paint: pick the language (?lang=, then the saved choice, then Persian)
         and mark that JavaScript runs, so the plain-HTML copy below stays out of sight. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var q = new URLSearchParams(location.search).get("lang");
          var s = null;
          try { s = localStorage.getItem("sdn-lang"); } catch (e) {}
          var l = q === "en" || q === "fa" ? q : s === "en" || s === "fa" ? s : "fa";
          root.lang = l;
          root.dir = l === "fa" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>

    <style>
      html { background: #050507; }
      .seo-static { box-sizing: border-box; max-width: 780px; margin: 0 auto; padding: 56px 20px 80px; color: #b2b2c3; font: 16px/1.95 Vazirmatn, Tahoma, system-ui, sans-serif; }
      .seo-static h1 { margin: 0.2em 0 0.6em; color: #f6f6f8; font-size: 1.7rem; line-height: 1.5; }
      .seo-static h2 { margin: 2.4em 0 0.6em; color: #f6f6f8; font-size: 1.3rem; }
      .seo-static h3 { margin: 1.6em 0 0.3em; color: #ebebf0; font-size: 1.08rem; }
      .seo-static a { color: #ffb547; }
      .seo-static .seo-brand { margin: 0; color: #ffb547; font: 700 0.9rem/1 system-ui, sans-serif; letter-spacing: 0.2em; }
      /* with JavaScript the app replaces this copy within moments; on a very slow connection it fades in after a few seconds instead of leaving a blank page */
      html.js .seo-static { opacity: 0; animation: seo-show 0.5s ease 5s forwards; }
      @keyframes seo-show { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><!--seo:static--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
